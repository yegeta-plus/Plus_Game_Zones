<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Transparent background vector for Telebirr -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Ring -->
    <circle cx="90" cy="90" r="82" fill="url(#teleCyanGrad)" opacity="0.2" />
    
    <!-- Dynamic 'telebirr' mobile swoosh emblem -->
    <!-- Primary Cyan Ring Segment -->
    <path d="M90 15 A75 75 0 1 1 25 125" stroke="url(#teleCyanGrad)" stroke-width="22" stroke-linecap="round" fill="none" />
    
    <!-- Secondary Orange Accent Ring Segment -->
    <path d="M125 25 A75 75 0 0 1 165 90" stroke="url(#teleOrangeGrad)" stroke-width="22" stroke-linecap="round" fill="none" />
    
    <!-- Stylized 'tb' / Mobile phone icon in center -->
    <rect x="68" y="52" width="44" height="76" rx="12" fill="#0284C7" stroke="#FFFFFF" stroke-width="4" />
    <!-- Phone Screen -->
    <rect x="74" y="62" width="32" height="48" rx="4" fill="#38BDF8" />
    <!-- Checkmark / Telebirr 't' signal inside screen -->
    <path d="M82 86 L88 92 L98 78" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Phone Home Dot -->
    <circle cx="90" cy="118" r="3" fill="#FFFFFF" />
    
    <!-- Gold coin floating top right -->
    <circle cx="145" cy="50" r="18" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
    <text x="145" y="56" font-family="sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">b</text>
  </g>
  
  <defs>
    <linearGradient id="teleCyanGrad" x1="15" y1="15" x2="165" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="teleOrangeGrad" x1="125" y1="25" x2="165" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
</svg>
